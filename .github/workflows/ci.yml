name: Healthcare Chatbot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Write clean requirements inside Linux to bypass BOM/encoding errors
        echo "fastapi" > reqs.txt
        echo "uvicorn" >> reqs.txt
        echo "openai" >> reqs.txt
        echo "pydantic" >> reqs.txt
        pip install -r reqs.txt

    - name: Run Linter (Ruff)
      run: |
        pip install ruff --if-present
        ruff check . --exit-zero --if-present

    - name: Run Tests
      run: |
        pip install pytest --if-present
        pytest --if-present