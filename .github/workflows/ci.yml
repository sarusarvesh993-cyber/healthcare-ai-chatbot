name: Healthcare Chatbot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Node.js (To bypass Node deprecation warnings)
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        echo "fastapi" > reqs.txt
        echo "uvicorn" >> reqs.txt
        echo "openai" >> reqs.txt
        echo "pydantic" >> reqs.txt
        pip install -r reqs.txt

    - name: Run Syntax Verification
      run: |
        # Strictly verify syntax of only python source files, avoiding javascript/node caches
        python -m py_compile *.py